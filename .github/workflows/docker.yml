name: Docker build

# Chỉ build khi thứ ảnh hưởng tới image thay đổi (image nặng, không build mọi lần push).
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, requirements.txt, "ragbot/**", chatbot.py, docker-compose.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, requirements.txt, "ragbot/**", chatbot.py, docker-compose.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
